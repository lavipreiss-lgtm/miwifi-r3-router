name: Build OpenWRT for AP

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/x-wrt/x-wrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ap.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  #by default used .config for build from repo
  #if your repo not contain .config, you may download it from direct url setting by ALT_CONFIG_URL variable
  #if ALT_CONFIG_URL commented and repo not contain .config - use default for mt7620
  #.config from repo > .config from url > default .config
  ALT_CONFIG_URL: false
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: false
  TZ: Europe/Minsk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget ccache
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH xwrt
        ln -sf /workdir/xwrt $GITHUB_WORKSPACE/xwrt

    - name: Cache downloaded packages
      uses: actions/cache@v4
      with:
        path: /workdir/xwrt/dl
        key: dl-${{ env.REPO_BRANCH }}-${{ hashFiles('ap.config') }}
        restore-keys: |
          dl-${{ env.REPO_BRANCH }}-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ env.REPO_BRANCH }}-${{ hashFiles('ap.config') }}
        restore-keys: |
          ccache-${{ env.REPO_BRANCH }}-

    - name: Configure ccache
      run: |
        ccache --set-config=cache_dir=~/.ccache
        ccache --set-config=max_size=2G
        ccache --set-config=compression=true
        echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF xwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd xwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    - name: Update feeds
      run: cd xwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd xwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        check: 0
      run: |
        [ -e files ] && mv files xwrt/files
        if [ -e $CONFIG_FILE ];
        then mv $CONFIG_FILE xwrt/.config;
             echo "Use .config from repo";
        else if [ ! -z "$ALT_CONFIG_URL" ];
             then curl -Lo xwrt/.config $ALT_CONFIG_URL;
                  echo "successfully download .config from url, .config in repo don't exist";
                  echo "checking .config";
                  check=$(grep -e "^# Automatically generated file; DO NOT EDIT.$" xwrt/.config && grep -e "^# OpenWrt Configuration$" xwrt/.config);
                  if [ ! "$(echo $check |wc -c)" = "69" ];
                  then echo ".config invalid, setting default for mt7620";
                       rm -rf xwrt/.config;
                       cp xwrt/feeds/x/rom/lede/config.ramips-mt7620 xwrt/.config;
                  else echo "naive check passed";
                  fi
             else cp xwrt/feeds/x/rom/lede/config.ramips-mt7620 xwrt/.config;
                  echo "use default .config for mt7620 in xwrt, url not set and .config in repo don't exist";
             fi
        fi
        chmod +x $DIY_P2_SH
        cd xwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    - name: Download package
      id: package
      run: |
        cd xwrt

        sed -i -E '/^(# )?CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|qrencode)(=| is not set)/d' .config

        cat >> .config <<'EOF'
        CONFIG_PACKAGE_kmod-wireguard=y
        CONFIG_PACKAGE_wireguard-tools=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG_PACKAGE_qrencode=y
        EOF

        make defconfig

        for p in kmod-wireguard wireguard-tools luci-proto-wireguard qrencode; do
          grep -qx "CONFIG_PACKAGE_${p}=y" .config || {
            echo "ERROR: CONFIG_PACKAGE_${p} is unavailable or was removed"
            exit 1
          }
        done

        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      run: |
        cd xwrt
        echo -e "$(nproc) thread compile"
        echo "ENABLE_CCACHE=true" >> $GITHUB_ENV
        make -j$(nproc) || make -j1 || make -j1 V=s
        ccache -s 2>/dev/null || true
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -n 's/.*DEVICE_\(.*\)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: xwrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: xwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd xwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: xwrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT
    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: astolfogit/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.2.1
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
